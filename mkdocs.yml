site_name: EDD Core
site_description: Minimal, harness-agnostic evaluation-driven development engine
repo_url: https://github.com/edd-framework/edd-core
repo_name: edd-framework/edd-core

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

nav:
  - Home: README.md
  - Quickstart: docs/quickstart.md
  - Contract Reference: CONTRACT.md
  - Decision Engine: docs/decision-engine.md
  - v1 Migration: docs/migration-v1-to-v2.md
